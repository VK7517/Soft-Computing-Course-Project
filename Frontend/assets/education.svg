<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="150" cy="150" r="135" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Stacked Books -->
  <!-- Book 3 (Bottom) -->
  <rect x="50" y="210" width="200" height="30" rx="5" fill="#475569"/>
  <rect x="60" y="215" width="180" height="20" rx="3" fill="#F1F5F9"/>

  <!-- Book 2 (Middle) -->
  <rect x="65" y="175" width="170" height="28" rx="5" fill="url(#book2)"/>
  <rect x="75" y="180" width="150" height="18" rx="3" fill="#ECFDF5"/>

  <!-- Book 1 (Top) -->
  <rect x="80" y="140" width="140" height="28" rx="5" fill="url(#book1)"/>
  <rect x="90" y="145" width="120" height="18" rx="3" fill="#EFF6FF"/>

  <!-- Target & Arrow Emblem above books -->
  <g transform="translate(150, 75)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#targetGrad)" stroke-width="8"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#3B82F6" stroke-width="6"/>
    <circle cx="0" cy="0" r="12" fill="#10B981"/>
    <!-- Arrow -->
    <path d="M -30 30 L 10 -10 M 10 -10 L -5 -10 M 10 -10 L 10 5" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
