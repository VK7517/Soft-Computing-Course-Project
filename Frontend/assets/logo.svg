<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Outer Shield / Badge -->
    <path d="M 50 5 L 85 20 L 85 60 C 85 82 50 98 50 98 C 50 98 15 82 15 60 L 15 20 Z" fill="url(#logoGrad)" />
    <!-- Graduation Cap -->
    <polygon points="50,22 75,34 50,46 25,34" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="50,46 68,37 68,52 50,60" fill="#E2E8F0" opacity="0.9"/>
    <path d="M 33 39 L 33 55 C 33 58 50 63 50 63 C 50 63 67 58 67 55 L 67 39" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Analytics Curve / Fuzzy Node -->
    <path d="M 28 75 Q 38 62 50 72 T 72 65" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="50" cy="72" r="3.5" fill="#34D399"/>
    <circle cx="72" cy="65" r="3.5" fill="#60A5FA"/>
  </g>

  <!-- Typography with High Contrast White & Bright Blue -->
  <text x="115" y="52" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">ACADEMIC<tspan fill="#60A5FA">RISK</tspan>.AI</text>
  <text x="115" y="78" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="0.5">OPTIMIZED FUZZY EARLY INTERVENTION</text>
  <rect x="115" y="88" width="240" height="3" rx="1.5" fill="url(#accentGrad)"/>
</svg>
