<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad)" stroke="#BFDBFE" stroke-width="4"/>

  <!-- Laptop Screen Base -->
  <rect x="90" y="270" width="220" height="90" rx="10" fill="#1E293B"/>
  <rect x="100" y="280" width="200" height="70" rx="6" fill="#0F172A"/>
  <!-- Screen Graph Visualization -->
  <path d="M 120 330 L 150 310 L 180 325 L 220 295 L 250 305 L 280 290" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="280" cy="290" r="4" fill="#3B82F6"/>

  <!-- Student Body -->
  <!-- Shoulders / Shirt -->
  <path d="M 100 370 Q 100 270 200 270 Q 300 270 300 370 Z" fill="url(#shirtGrad)"/>

  <!-- Neck -->
  <rect x="180" y="200" width="40" height="40" rx="8" fill="#FBBF24"/>

  <!-- Head & Hair -->
  <circle cx="200" cy="160" r="55" fill="#FBBF24"/>

  <!-- Hair Cap -->
  <path d="M 145 155 Q 200 90 255 155 Q 240 115 200 115 Q 160 115 145 155 Z" fill="#1E293B"/>

  <!-- Glasses -->
  <circle cx="180" cy="160" r="16" fill="none" stroke="#0F172A" stroke-width="4"/>
  <circle cx="220" cy="160" r="16" fill="none" stroke="#0F172A" stroke-width="4"/>
  <line x1="196" y1="160" x2="204" y2="160" stroke="#0F172A" stroke-width="4"/>

  <!-- Graduation Cap Floating Accent -->
  <g transform="translate(140, 20) scale(0.6)">
    <polygon points="100,30 160,60 100,90 40,60" fill="#1E3A8A"/>
    <polygon points="100,90 145,68 145,98 100,115" fill="#2563EB"/>
    <line x1="160" y1="60" x2="175" y2="90" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="175" cy="93" r="5" fill="#F59E0B"/>
  </g>
</svg>
