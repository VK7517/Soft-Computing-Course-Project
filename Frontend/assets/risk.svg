<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gaugeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="135" fill="#0F172A"/>

  <!-- Semi-circular Risk Arc Gauge -->
  <path d="M 40 180 A 110 110 0 0 1 260 180" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round"/>
  <path d="M 40 180 A 110 110 0 0 1 260 180" fill="none" stroke="url(#gaugeBg)" stroke-width="24" stroke-linecap="round"/>

  <!-- Gauge Needle -->
  <g transform="translate(150, 180) rotate(35)">
    <polygon points="-6,0 0,-95 6,0" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="14" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Risk Digital Readout -->
  <text x="150" y="235" font-family="'Inter', sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle">74.5<tspan font-size="18" fill="#EF4444"> %</tspan></text>
  <text x="150" y="260" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#94A3B8" text-anchor="middle">HIGH RISK ASSESSMENT</text>
</svg>
